<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Personal · Jersey Mark</title>
<link rel="icon" type="image/svg+xml" href="/images/jersey-mark-seal.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100vh;}
body{
  background:#dfc99a;
  font-family:'Crimson Text',serif;
  color:#0f0800;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem 1rem;
  position:relative;
  overflow-x:hidden;
}
.parchment-bg{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 28px,rgba(101,67,33,0.04) 29px),repeating-linear-gradient(90deg,transparent,transparent 28px,rgba(101,67,33,0.04) 29px);pointer-events:none;z-index:0;}
.vignette{position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(80,40,10,0.35) 100%);pointer-events:none;z-index:0;}
.outer-border{
  position:relative;z-index:1;
  border:3px solid #5a3510;border-radius:4px;padding:4px;
  max-width:680px;width:100%;
  background:#dfc99a;
}
.inner-border{
  border:1.5px solid #7a4e20;border-radius:2px;
  padding:2.4rem 2rem 2.6rem;
}
.corner-ornament{position:absolute;font-size:20px;color:#1a0f00;line-height:1;}
.corner-tl{top:10px;left:10px;}
.corner-tr{top:10px;right:10px;transform:scaleX(-1);}
.corner-bl{bottom:10px;left:10px;transform:scaleY(-1);}
.corner-br{bottom:10px;right:10px;transform:scale(-1);}
.cartouche{text-align:center;margin-bottom:1.8rem;}
.cartouche-border{
  border:2px solid #5a3510;border-radius:50% / 30%;
  padding:1rem 2.2rem 1.2rem;display:inline-block;min-width:70%;
  background:rgba(180,130,70,0.3);position:relative;
}
.cartouche-border::before,.cartouche-border::after{content:'— ✦ —';display:block;font-size:12px;color:#1a0f00;letter-spacing:0.2em;}
.cartouche-border::before{margin-bottom:0.3rem;}
.cartouche-border::after{margin-top:0.3rem;}
h1{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:700;color:#0f0800;line-height:1.15;letter-spacing:0.04em;}
.subtitle{font-family:'IM Fell English',serif;font-style:italic;font-size:1.05rem;color:#1a0f00;margin-top:0.3rem;}

/* Lock screen */
.lockscreen{display:flex;flex-direction:column;align-items:center;gap:1.4rem;padding:1rem 0;}
.lock-prompt{font-family:'IM Fell English',serif;font-style:italic;font-size:1.1rem;color:#1a0f00;text-align:center;}
.pin-row{display:flex;gap:0.6rem;justify-content:center;}
.pin-row input{
  width:46px;height:58px;font-size:24px;text-align:center;
  background:#f3e6c4;color:#0f0800;
  border:1.5px solid #7a4e20;border-radius:4px;outline:none;
  font-family:'Cinzel',serif;font-weight:700;
  caret-color:#5a3510;
}
.pin-row input:focus{border-color:#5a3510;background:#fbefcf;box-shadow:0 0 0 2px rgba(90,53,16,0.25);}
.pin-error{font-family:'IM Fell English',serif;font-style:italic;color:#7a2a1a;font-size:0.95rem;min-height:1.2em;}

/* Unlocked grid */
.cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1rem;margin-top:0.5rem;
}
.card{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-decoration:none;color:#0f0800;
  border:2px solid #5a3510;border-radius:6px;
  padding:1.4rem 1rem;
  background:rgba(180,130,70,0.18);
  transition:transform 0.18s, background 0.18s, box-shadow 0.18s;
  text-align:center;
  min-height:140px;
}
.card:hover{
  transform:translateY(-2px);
  background:rgba(180,130,70,0.32);
  box-shadow:0 6px 18px rgba(80,40,10,0.18);
}
.card svg{width:36px;height:36px;color:#5a3510;margin-bottom:0.6rem;}
.card-title{font-family:'Cinzel',serif;font-size:1.05rem;font-weight:700;letter-spacing:0.04em;}
.card-sub{font-family:'IM Fell English',serif;font-style:italic;font-size:0.85rem;color:#1a0f00;margin-top:0.2rem;}

.footer{display:flex;justify-content:space-between;align-items:center;margin-top:1.6rem;font-family:'IM Fell English',serif;font-style:italic;font-size:0.85rem;color:#3a2510;}
.footer a, .footer button{color:#3a2510;background:none;border:none;cursor:pointer;font-family:inherit;font-style:italic;font-size:inherit;text-decoration:underline dotted;padding:0;}
.footer a:hover, .footer button:hover{color:#7a2a1a;}
.hidden{display:none !important;}
</style>
</head>
<body>
<div class="parchment-bg"></div>
<div class="vignette"></div>

<div class="outer-border">
  <span class="corner-ornament corner-tl">✦</span>
  <span class="corner-ornament corner-tr">✦</span>
  <span class="corner-ornament corner-bl">✦</span>
  <span class="corner-ornament corner-br">✦</span>

  <div class="inner-border">
    <div class="cartouche">
      <div class="cartouche-border">
        <h1>Personal</h1>
        <div class="subtitle">— for Jersey Mark only —</div>
      </div>
    </div>

    <!-- Lock screen -->
    <section id="lockscreen" class="lockscreen">
      <div class="lock-prompt">Enter PIN to continue</div>
      <div class="pin-row" id="pin-row">
        <input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-i="0">
        <input type="password" inputmode="numeric" maxlength="1" data-i="1">
        <input type="password" inputmode="numeric" maxlength="1" data-i="2">
        <input type="password" inputmode="numeric" maxlength="1" data-i="3">
        <input type="password" inputmode="numeric" maxlength="1" data-i="4">
        <input type="password" inputmode="numeric" maxlength="1" data-i="5">
      </div>
      <div class="pin-error" id="pin-error"></div>
    </section>

    <!-- Unlocked grid -->
    <section id="hub" class="hidden">
      <div class="cards">
        <a class="card" href="https://portfolio.journeyswithjerseymark.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l6-6 4 4 8-8"/><polyline points="14 8 21 8 21 15"/></svg>
          <div class="card-title">Portfolio</div>
          <div class="card-sub">holdings &amp; markets</div>
        </a>
        <a class="card" href="https://budget.journeyswithjerseymark.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="17" cy="14" r="1.5"/></svg>
          <div class="card-title">Budget</div>
          <div class="card-sub">monthly planning</div>
        </a>
        <a class="card" href="/admin.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <div class="card-title">Admin</div>
          <div class="card-sub">site &amp; albums</div>
        </a>
        <a class="card" href="https://dash.journeyswithjerseymark.com/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/><circle cx="7" cy="14" r="1.2" fill="currentColor"/><circle cx="11" cy="10" r="1.2" fill="currentColor"/><circle cx="14" cy="13" r="1.2" fill="currentColor"/><circle cx="19" cy="7" r="1.2" fill="currentColor"/></svg>
          <div class="card-title">AI Hub</div>
          <div class="card-sub">Claude &amp; agents</div>
        </a>
      </div>

      <div class="footer">
        <a href="/">← back to public site</a>
        <button id="lock-btn" type="button">lock</button>
      </div>
    </section>
  </div>
</div>

<script>
(function(){
  const inputs = document.querySelectorAll('#pin-row input');
  const errEl = document.getElementById('pin-error');
  const lock = document.getElementById('lockscreen');
  const hub = document.getElementById('hub');

  function unlock(){
    lock.classList.add('hidden');
    hub.classList.remove('hidden');
  }
  function relock(){
    sessionStorage.removeItem('jm_personal_unlocked');
    inputs.forEach(i => i.value = '');
    errEl.textContent = '';
    hub.classList.add('hidden');
    lock.classList.remove('hidden');
    inputs[0].focus();
  }

  if (sessionStorage.getItem('jm_personal_unlocked') === '1') {
    unlock();
  } else {
    setTimeout(() => inputs[0].focus(), 100);
  }

  document.getElementById('lock-btn').addEventListener('click', relock);

  inputs.forEach((inp, i) => {
    inp.addEventListener('input', e => {
      const v = e.target.value.replace(/\D/g, '');
      e.target.value = v.slice(0, 1);
      if (e.target.value && i < inputs.length - 1) {
        inputs[i + 1].focus();
      }
      maybeSubmit();
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !e.target.value && i > 0) {
        inputs[i - 1].focus();
        inputs[i - 1].value = '';
      } else if (e.key === 'ArrowLeft' && i > 0) {
        inputs[i - 1].focus(); e.preventDefault();
      } else if (e.key === 'ArrowRight' && i < inputs.length - 1) {
        inputs[i + 1].focus(); e.preventDefault();
      }
    });
    inp.addEventListener('paste', e => {
      const txt = (e.clipboardData?.getData('text') || '').replace(/\D/g, '').slice(0, inputs.length);
      if (!txt) return;
      e.preventDefault();
      for (let j = 0; j < inputs.length; j++) {
        inputs[j].value = txt[j] || '';
      }
      inputs[Math.min(txt.length, inputs.length - 1)].focus();
      maybeSubmit();
    });
    inp.addEventListener('focus', e => e.target.select());
  });

  let submitting = false;
  async function maybeSubmit() {
    const pin = Array.from(inputs).map(i => i.value).join('');
    if (pin.length !== inputs.length || submitting) return;
    submitting = true;
    errEl.textContent = '';
    try {
      const res = await fetch('/api/verify-pin', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ pin })
      });
      if (res.ok) {
        sessionStorage.setItem('jm_personal_unlocked', '1');
        unlock();
      } else {
        errEl.textContent = 'incorrect — try again';
        inputs.forEach(i => i.value = '');
        inputs[0].focus();
      }
    } catch (err) {
      errEl.textContent = 'something went wrong — please retry';
    }
    submitting = false;
  }
})();
</script>
</body>
</html>
